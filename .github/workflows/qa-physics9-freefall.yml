name: QA · Physics 9 Free Fall
on:
  pull_request:
    paths:
      - "evaluaciones/caida-libre/**"
      - "supabase/functions/physics9-freefall-exam/**"
      - "supabase/migrations/20261103_physics9_freefall_**"
      - ".github/workflows/qa-physics9-freefall.yml"
  push:
    branches: [main]
    paths:
      - "evaluaciones/caida-libre/**"
      - "supabase/functions/physics9-freefall-exam/**"
      - "supabase/migrations/20261103_physics9_freefall_**"
      - ".github/workflows/qa-physics9-freefall.yml"
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Parse Edge TypeScript (without modifying tracked files)
        run: |
          cp supabase/functions/physics9-freefall-exam/index.ts /tmp/physics9-freefall-check.ts
          deno fmt /tmp/physics9-freefall-check.ts
      - name: Node and numeric/scientific contracts
        run: |
          node --check evaluaciones/caida-libre/app.js
          node --test evaluaciones/caida-libre/qa.test.cjs
